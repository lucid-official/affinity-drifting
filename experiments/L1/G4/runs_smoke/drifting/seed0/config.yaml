field: release
release:
  temperatures:
  - 0.02
  - 0.05
  - 0.2
phi: identity
psi: oracle
x_kernel:
  kind: gaussian
  sigma_rule: knn_median
h_p:
  rule: inf
  n_star: 16
  scale: 1.0
  fixed_value: null
  neighbors: semantic
h_q:
  ratio: 0.0
  exclude_self: true
gen:
  M: 8
positives:
  source: bank
  oracle_n: 16
  noise: none
normalization:
  feature: frozen
  drift: true
softmax: separate
negative:
  type: self
  lambda: 0.0
level1:
  n_train: 10000
  n_heldout: 256
  n_eval_train: 256
  eval_samples: 512
  data_seed: 0
  delta: 0.0625
  lipschitz: null
  mode_std: 0.1
  mix_beta: 2.0
model:
  eps_dim: 4
  hidden: 256
  depth: 3
  cond_hidden: 64
train:
  optimizer: adam
  lr: 0.001
  steps: 20000
  steps_multiplier: 1
  batch_conditions: 64
  ema: 0.999
  log_every: 100
