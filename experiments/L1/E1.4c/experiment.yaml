id: E1.4c
level: L1
claim: C3
title: 'C3 re-test (D25): resolution in c raised by random Fourier features of c'
runner: train
seeds:
- 0
- 1
- 2
- 3
- 4
reference_arm: raw_h1
max_knobs: 2
allowed_delta:
- level1.delta
- level1.fourier_scale
- h_p.rule
- field
common:
  level1.delta: 0.0
arms:
  raw_h0:
    set:
      h_p.rule: zero
  raw_h1: {}
  s1_h0:
    set:
      level1.fourier_scale: 1.0
      h_p.rule: zero
  s1_h1:
    set:
      level1.fourier_scale: 1.0
  s4_h0:
    set:
      level1.fourier_scale: 4.0
      h_p.rule: zero
  s4_h1:
    set:
      level1.fourier_scale: 4.0
  s16_h0:
    set:
      level1.fourier_scale: 16.0
      h_p.rule: zero
  s16_h1:
    set:
      level1.fourier_scale: 16.0
  s64_h0:
    set:
      level1.fourier_scale: 64.0
      h_p.rule: zero
  s64_h1:
    set:
      level1.fourier_scale: 64.0
  drifting:
    set:
      h_p.rule: zero
      field: release
    ref: raw_h0
judge:
  kind: composite
  checks:
  # 1. manipulation check: at s = 64 the one-positive generator is closer to its own positive than with raw c
  - type: paired
    metric: own_positive_dist_train
    a: raw_h0
    b: s64_h0
    fail_as: INCONCLUSIVE
  # 2. the one-positive W2 on training conditions rises toward memorization
  - type: paired
    metric: w2_train
    a: s64_h0
    b: raw_h0
  # 3. the gap single − AffD grows with resolution (raw → s1 → s4 → s16 → s64)
  - type: gap_monotone
    metric: w2_train
    pairs:
    - - raw_h0
      - raw_h1
    - - s1_h0
      - s1_h1
    - - s4_h0
      - s4_h1
    - - s16_h0
      - s16_h1
    - - s64_h0
      - s64_h1
report_metrics:
- w2_train
- w2_heldout
- mci_train
- mci_heldout
- own_positive_dist_train
- own_positive_share_train
- memorization_train
figures:
  FC.1:
    arms:
    - drifting
    - s64_h0
    - s64_h1
  F1.4:
    axis: fourier
  F1.5:
    axis: fourier
