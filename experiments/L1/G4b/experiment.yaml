id: G4b
level: L1
claim: Gate G4 (2nd)
title: unconditional drifting (full-batch repulsion) fits the marginal; the learning rate is fixed once here
runner: train
seeds: [0, 1, 2, 3, 4]
reference_arm: uncond_lr3e-4
allowed_delta: [train.lr, h_p.rule, h_q.ratio, field]
arms:
  uncond_lr1e-4: {set: {h_p.rule: inf, h_q.ratio: 1.0, train.lr: 1.0e-4}}
  uncond_lr3e-4: {set: {h_p.rule: inf, h_q.ratio: 1.0, train.lr: 3.0e-4}}
  uncond_lr1e-3: {set: {h_p.rule: inf, h_q.ratio: 1.0, train.lr: 1.0e-3}}
  drifting: {set: {field: release, h_p.rule: inf, h_q.ratio: 1.0, train.lr: 3.0e-4}}   # baseline (D11)
judge:
  kind: composite
  checks:
    - {type: select_min_within, arms: [uncond_lr1e-4, uncond_lr3e-4, uncond_lr1e-3], metric: w2_marginal_heldout,
       ref_metric: w2_marginal_datadata_heldout, factor: 2.0}
report_metrics: [w2_marginal_heldout, w2_marginal_datadata_heldout, w2_marginal_train, recall_heldout, train_seconds]
figures: {}
