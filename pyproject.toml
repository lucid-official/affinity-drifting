[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "affdrift"
version = "0.1.0"
description = "Affinity Drifting (AffD): bottom-up single-factor attribution experiments"
requires-python = ">=3.14"
authors = [{ name = "Chan Lee" }]
dependencies = [
    "lucid-dl==3.16.4",
    "numpy",
    "scipy",
    "matplotlib",
    "pyyaml",
    "wandb",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["affdrift*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
markers = ["slow: long-running numerical checks"]
